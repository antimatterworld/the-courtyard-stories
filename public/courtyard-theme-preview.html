<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Courtyard theme preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night: #0a0f1f;
      --plaster: #f3ebdd;
      --marigold: #ff9f1c;
      --bougain: #d6336c;
      --sand: #c9a37a;
      --topbar-bg: #0f1530;
      --glow: radial-gradient(ellipse 80% 60% at 72% 38%, rgba(255, 159, 28, 0.22), transparent 68%);
    }
    html[data-theme="night"] {
      --bg: #0a0f1f;
      --accent: #ff9f1c;
      --glow: radial-gradient(ellipse 80% 60% at 72% 38%, rgba(255, 159, 28, 0.22), transparent 68%);
    }
    html[data-theme="cobalt"] {
      --bg: #0a0f1f;
      --accent: #2f5bd0;
      --glow: radial-gradient(ellipse 75% 55% at 70% 40%, rgba(78, 134, 232, 0.24), transparent 65%);
    }
    html[data-theme="marigold"] {
      --bg: #0f1530;
      --accent: #ff9f1c;
      --glow: radial-gradient(ellipse 78% 58% at 68% 42%, rgba(255, 159, 28, 0.28), rgba(214, 51, 108, 0.1) 50%, transparent 70%);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Instrument Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--plaster);
    }
  </style>
  <style>
    .shell { min-height: 100vh; position: relative; overflow: hidden; }
    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--glow);
      pointer-events: none;
    }
    .nav {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1080px, calc(100% - 28px));
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--topbar-bg);
      border: 1px solid #ffffff1a;
      z-index: 2;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 16px;
      white-space: nowrap;
    }
    .links { display: flex; gap: 24px; font-size: 14px; color: var(--sand); }
    .cta {
      background: var(--marigold);
      color: var(--night);
      border-radius: 999px;
      padding: 0 16px;
      height: 44px;
      line-height: 44px;
      font-weight: 600;
      font-size: 14px;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: end;
      min-height: 100vh;
      padding: 120px 5vw 8vh;
      gap: 24px;
    }
    .copy h1 {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(2.5rem, 7.2vw, 6.2rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
      text-wrap: balance;
      max-width: 12ch;
    }
    .copy p { color: #c9c3b6; max-width: 42ch; line-height: 1.55; }
    .copy::before {
      content: "";
      position: absolute;
      inset: auto auto 6vh 4vw;
      width: min(520px, 90vw);
      height: 280px;
      background: linear-gradient(105deg, rgba(10, 15, 31, 0.9), transparent 70%);
      z-index: -1;
      border-radius: 20px;
    }
    .copy { position: relative; }
    .arch-slot {
      justify-self: end;
      align-self: center;
      width: min(420px, 40vw);
      aspect-ratio: 2/3;
      border: 1px dashed #ffffff22;
      border-radius: 120px 120px 12px 12px;
      display: grid;
      place-items: center;
      color: var(--sand);
      font-size: 13px;
    }
    .picker {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #0f1530;
      border: 1px solid #ffffff1a;
      border-radius: 999px;
      z-index: 3;
    }
    .picker button {
      border: 1px solid #ffffff22;
      background: transparent;
      color: var(--plaster);
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      font-family: inherit;
    }
    .picker button.active {
      background: var(--accent);
      color: var(--night);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="nav" aria-label="Preview navbar">
      <div class="brand">
        <svg width="20" height="26" viewBox="0 0 20 26" aria-hidden="true">
          <path d="M2 24V12C2 6.5 5.5 2 10 2s8 4.5 8 10v12" fill="none" stroke="#FF9F1C" stroke-width="1.6" />
        </svg>
        Courtyard Stories
      </div>
      <div class="links">Work · Services · Studio · Visit</div>
      <div class="cta">Enquire</div>
    </header>
    <main class="hero">
      <div class="copy">
        <h1>Stories live in places.</h1>
        <p>Kapashera · five architectural worlds · one private courtyard</p>
      </div>
      <div class="arch-slot">WebGL / arch lives here</div>
    </main>
    <div class="picker" aria-label="Theme options">
      <button type="button" data-theme="night" class="active">A · Night</button>
      <button type="button" data-theme="cobalt">B · Cobalt</button>
      <button type="button" data-theme="marigold">C · Marigold</button>
    </div>
  </div>
  <script>
    const root = document.documentElement;
    document.querySelectorAll(".picker button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const theme = btn.getAttribute("data-theme");
        root.setAttribute("data-theme", theme);
        document.querySelectorAll(".picker button").forEach((b) => b.classList.toggle("active", b === btn));
      });
    });
  </script>
</body>
</html>
