<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Courtyard Stories — Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0A0F1F; --plaster:#F3EBDD; --marigold:#FF9F1C; --bougain:#D6336C; --cobalt:#2F5BD0; --sand:#C9A37A;
  --display:'Syne','Arial Black',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit;margin:0}
html,body{height:100%}
body{background:var(--night);color:var(--plaster);font-family:var(--body);overflow:hidden}

#site{position:fixed;inset:0;display:grid;place-content:center;gap:28px;padding:24px;text-align:left;max-width:760px;margin:auto}
#site h2{font:800 clamp(2.2rem,7vw,4.6rem)/1 var(--display);letter-spacing:-.03em}
#site p{color:#c9c3b6;max-width:46ch;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:#ffffff0f;font-size:.85rem}
.chip i{width:22px;height:22px;border-radius:50%;display:block}
button{align-self:start;font:500 .95rem var(--body);color:var(--night);background:var(--marigold);border:0;border-radius:999px;padding:13px 24px;min-height:48px;cursor:pointer}
button:focus-visible{outline:2px solid var(--plaster);outline-offset:3px}

#loader{position:fixed;inset:0;z-index:10;background:var(--night);display:grid;place-items:center;overflow:hidden;transition:opacity .8s ease .9s}
#loader.gone{opacity:0;pointer-events:none}
#arch{position:absolute;left:50%;bottom:0;height:78%;width:auto;aspect-ratio:2/3;transform:translateX(-50%);transform-origin:50% 72%;
  transition:transform 1.3s cubic-bezier(.75,0,.2,1)}
#loader.done #arch{transform:translateX(-50%) scale(22)}
#line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.6,0,.2,1) .2s forwards}
#loader.done #line{opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}

#name{position:relative;z-index:2;font:800 clamp(2.6rem,11vw,9rem)/.95 var(--display);letter-spacing:-.04em;text-align:center;color:#fff;mix-blend-mode:difference;transition:opacity .5s ease,transform 1s cubic-bezier(.75,0,.2,1)}
#loader.done #name{opacity:0;transform:translateY(-8vh)}
.ln{display:block;overflow:hidden;padding:.06em .04em .1em}
.ch{display:inline-block;transform:translateY(115%) rotate(6deg);animation:up .95s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*38ms + 500ms)}
.sp{display:inline-block;width:.28em}
@keyframes up{to{transform:none}}

#count{position:absolute;right:max(20px,4vw);bottom:max(20px,4vh);font:700 clamp(1.6rem,4vw,3rem)/1 var(--display);font-variant-numeric:tabular-nums;transition:opacity .4s}
#hi{position:absolute;left:max(20px,4vw);bottom:max(24px,4.4vh);font:1rem 'Tiro Devanagari Hindi',serif;color:var(--sand);transition:opacity .4s}
#loader.done #count,#loader.done #hi{opacity:0}

@media (prefers-reduced-motion:reduce){
  .ch{animation-duration:.01s;animation-delay:0s}
  #line{animation-duration:.01s}
  #arch,#name,#loader{transition-duration:.01s;transition-delay:0s}
}
</style>
</head>
<body>

<main id="site">
  <h2>Five sets.<br>One courtyard.</h2>
  <p>The loader walks the visitor through an arch of light. When it opens, the site is already lit in the first chapter’s colour.</p>
  <div class="chips" id="chips"></div>
  <button id="replay">Replay the loader</button>
</main>

<div id="loader" role="status" aria-label="Loading The Courtyard Stories">
  <svg id="arch" viewBox="0 0 200 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <defs>
      <clipPath id="c"><path d="M20 300V130C20 72 78 44 100 6c22 38 80 66 80 124v170z"/></clipPath>
      <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#D6336C"/><stop offset=".55" stop-color="#FF9F1C"/><stop offset="1" stop-color="#FFD58A"/>
      </linearGradient>
    </defs>
    <g clip-path="url(#c)"><rect id="fill" width="200" height="300" fill="url(#g)" transform="translate(0 300)"/></g>
    <path id="line" pathLength="1" fill="none" stroke="#F3EBDD" stroke-width="1.4" d="M20 300V130C20 72 78 44 100 6c22 38 80 66 80 124v170"/>
  </svg>
  <h1 id="name" aria-label="The Courtyard Stories"></h1>
  <p id="hi" lang="hi">द कोर्टयार्ड स्टोरीज़</p>
  <div id="count" aria-hidden="true">0</div>
</div>

<script>
(function(){
  var lines=["The Courtyard","Stories"], h=document.getElementById('name'), i=0;
  lines.forEach(function(t){
    var l=document.createElement('span'); l.className='ln'; l.setAttribute('aria-hidden','true');
    t.split('').forEach(function(c){
      var s=document.createElement('span'); s.className=c===' '?'sp':'ch'; s.style.setProperty('--i',i++); s.textContent=c===' '?'':c; l.appendChild(s);
    });
    h.appendChild(l);
  });

  var palette=[["Night courtyard","#0A0F1F"],["Plaster","#F3EBDD"],["Marigold","#FF9F1C"],["Bougainvillea","#D6336C"],["Cobalt wash","#2F5BD0"],["Sandstone","#C9A37A"]];
  document.getElementById('chips').innerHTML=palette.map(function(p){
    return '<span class="chip"><i style="background:'+p[1]+';box-shadow:inset 0 0 0 1px #ffffff30"></i>'+p[0]+' '+p[1]+'</span>';
  }).join('');

  var loader=document.getElementById('loader'), fill=document.getElementById('fill'), count=document.getElementById('count');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches, dur=reduce?300:3800, t0=performance.now();
  function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
  function tick(now){
    var x=Math.min(1,(now-t0)/dur), p=ease(x);
    fill.setAttribute('transform','translate(0 '+(300*(1-p)).toFixed(1)+')');
    count.textContent=Math.round(p*100);
    if(x<1){requestAnimationFrame(tick)}
    else{loader.classList.add('done');setTimeout(function(){loader.classList.add('gone')},900)}
  }
  requestAnimationFrame(tick);
  document.getElementById('replay').onclick=function(){location.reload()};
})();
</script>
</body>
</html>
